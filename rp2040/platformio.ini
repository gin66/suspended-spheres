; PlatformIO project for the Fly-Micro4 (RP2040) node firmware.
;
; The host harness is separate: the shared motion_core tests are built with
; CMake as motion_core_tests (doc/motion_streaming_tdd.md §0.1). PlatformIO
; compiles the same motion_core sources for the board. Board identity, pin map
; and bus allocation live in doc/ and boards/.
;
; PIO budget (RP2040: two blocks x four state machines):
;   PIO1  can2040-lite, rx + tx state machines (the other two stay reserved)
;   PIO0  FastAccelStepper, one state machine per axis, all four axes
;
; FreeRTOS is deliberately not enabled. The Arduino-Pico FreeRTOS build
; defines __FREERTOS, and the core then claims a PIO state machine for its
; 64-bit cycle counter. can2040-lite leaves one PIO1 state machine free, but
; that SM (and the CAN block) must not be reused by FastAccelStepper, so the
; firmware uses the core's SYSTICK cycle counter. FastAccelStepper then drives
; its 4 ms task from the Pico alarm pool rather than an RTOS task.

[platformio]
default_envs = fly_micro4

[env:fly_micro4]
; Link library objects directly instead of archiving them. can2040-lite's
; portable layer calls a weak can2040_lite_hw_attach hook defined in the same
; archive member; with an archive the linker can resolve to that weak
; definition and never extract the Pico backend object. Direct objects keep
; the strong backend in the link.
lib_archive = no
; Community platform with the Earle Philhower RP2040 Arduino core. Matches the
; FastAccelStepper CI definition:
;   ../FastAccelStepper/extras/ci/platformio.ini [env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 133000000L

; The shared core lives outside rp2040/ so that folder stays firmware-only.
; ../lib/motion_core is a PlatformIO library (src/ + include/).
lib_extra_dirs = ../lib

lib_deps =
    ; master carries the RP2040 driver that builds without __FREERTOS.
    https://github.com/gin66/FastAccelStepper.git
    ; CAN2040-Lite: two PIO state machines (rx + tx), edge-locked ACK helper.
    ; symlink:// (not file://) so a build always uses the live local tree;
    ; file:// left a stale copied checkout in .pio/libdeps.
    symlink:///Users/jochen/src/can2040-lite
    ; The TMC2209 single-wire UART is driven entirely from src/tmc2209.cpp:
    ; SIO bit-bangs both the datagram and the oversampled reply. No TMC
    ; library, UART1 or PIO state machine is used for it.

build_src_flags =
    -std=gnu++17
    -Wall
    -Wextra

; can2040-lite is documented for -O2 or higher; the Arduino core defaults to -Os.
build_unflags =
    -Os
build_flags =
    -DPICO_RP2040
    -O2

; The ACK path has to run from RAM at 1 Mbit/s. The script excludes the
; can2040-lite objects from the generated flash link. memmap_katapult.ld has
; the same exclude and is not generated.
extra_scripts = post:can2040_ram.py

monitor_speed = 115200

; Bench image. The edge-pair record and raw capture were removed from the
; library, so this now matches fly_micro4; the env stays for existing scripts.
[env:fly_micro4_record]
extends = env:fly_micro4

; Application image for a board carrying Katapult. The linker script moves
; the vector table to 0x10004000 and drops the stage-2 and OTA shim. Flash the
; resulting firmware.bin with Katapult's flashtool; do not use -t upload.
[env:fly_micro4_katapult]
extends = env:fly_micro4
board_build.ldscript = memmap_katapult.ld

[env:fly_micro4_katapult_record]
extends = env:fly_micro4_record
board_build.ldscript = memmap_katapult.ld

; Bring-up only: ACK helper compiled out and the node held receive-only, so
; the Pico never drives the bus.
[env:fly_micro4_record_noack]
extends = env:fly_micro4_record
build_flags = ${env:fly_micro4_record.build_flags} -DCAN_ACK_GENERATION_SUPPORT=0 -DSS_CAN_RX_ONLY=1

; Bring-up only: noack image with the RX bit parser bracketed on GPIO18 so a
; logic analyzer can measure per-bit parse time with sub-microsecond
; resolution.  The library drives the pin; the app only selects it.
; GPIO18 is the unused BLTouch signal pin.
[env:fly_micro4_record_noack_probe]
extends = env:fly_micro4_record_noack
; Production build: the app polls can2040_lite_backend_poll(), so no test
; callback path is compiled.
build_flags = ${env:fly_micro4_record_noack.build_flags} -DCAN_RX_BIT_PROBE_PIN=18 -DSS_CAN_ISR_TIMING=0

; Bring-up only: 500 kbit/s variant, used to separate a bitrate/CPU-rate
; limit from a capture or protocol fault.
[env:fly_micro4_record_noack_500k]
extends = env:fly_micro4_record_noack
build_flags = ${env:fly_micro4_record_noack.build_flags} -DSS_CAN_BITRATE=500000

[env:fly_micro4_record_noack_125k]
extends = env:fly_micro4_record_noack
build_flags = ${env:fly_micro4_record_noack.build_flags} -DSS_CAN_BITRATE=125000

; Receive-only raw-capture image for step 1: the node never transmits and
; never ACKs. The raw RX FIFO words are streamed to the PC for analysis.
[env:fly_micro4_rxraw]
extends = env:fly_micro4
build_flags = ${env:fly_micro4.build_flags} -DSS_CAN_RX_ONLY=1 -DCAN_ACK_GENERATION_SUPPORT=0
