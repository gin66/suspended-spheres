; PlatformIO project for the Fly-Micro4 (RP2040) node firmware.
;
; The host harness is separate: rp2040/lib/motion_core/tests is built with
; CMake as motion_core_tests (doc/motion_streaming_tdd.md §0.1). PlatformIO
; compiles the same motion_core sources for the board. Board identity, pin map
; and bus allocation live in doc/ and boards/.

[platformio]
default_envs = rpipico

[env:rpipico]
; Community platform with the Earle Philhower RP2040 Arduino core.
; Matches the FastAccelStepper CI definition:
;   ../FastAccelStepper/extras/ci/platformio.ini [env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

; The shared core lives outside rp2040/ so that folder stays firmware-only.
; ../lib/motion_core is a PlatformIO library (src/ + include/).
lib_extra_dirs = ../lib

build_src_flags =
    -std=gnu++17
    -Wall
    -Wextra

build_flags =
    -DPICO_RP2040

monitor_speed = 115200
