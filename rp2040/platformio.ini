; PlatformIO project for the Fly-Micro4 (RP2040) node firmware.
;
; The host harness is separate: the shared motion_core tests are built with
; CMake as motion_core_tests (doc/motion_streaming_tdd.md §0.1). PlatformIO
; compiles the same motion_core sources for the board. Board identity, pin map
; and bus allocation live in doc/ and boards/.
;
; PIO budget (RP2040: two blocks x four state machines):
;   PIO1  can2040, one instance, all four state machines
;   PIO0  FastAccelStepper, one state machine per axis, all four axes
;
; FreeRTOS is deliberately not enabled. The Arduino-Pico FreeRTOS build
; defines __FREERTOS, and the core then claims a PIO state machine for its
; 64-bit cycle counter. That leaves fewer than four state machines in one
; block, which vanilla can2040 needs, so the firmware uses the core's SYSTICK
; cycle counter instead. FastAccelStepper then drives its 4 ms task from the
; Pico alarm pool rather than an RTOS task.

[platformio]
default_envs = fly_micro4

[env:fly_micro4]
; Community platform with the Earle Philhower RP2040 Arduino core. Matches the
; FastAccelStepper CI definition:
;   ../FastAccelStepper/extras/ci/platformio.ini [env:rpipico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 133000000L

; The shared core lives outside rp2040/ so that folder stays firmware-only.
; ../lib/motion_core is a PlatformIO library (src/ + include/).
lib_extra_dirs = ../lib

lib_deps =
    ; master carries the RP2040 driver that builds without __FREERTOS.
    https://github.com/gin66/FastAccelStepper.git
    https://github.com/KevinOConnor/can2040.git

build_src_flags =
    -std=gnu++17
    -Wall
    -Wextra

; can2040 is documented for -O2 or higher; the Arduino core defaults to -Os.
build_unflags =
    -Os
build_flags =
    -DPICO_RP2040
    -O2

monitor_speed = 115200

; Application image for a board carrying Katapult. The linker script moves
; the vector table to 0x10004000 and drops the stage-2 and OTA shim. Flash the
; resulting firmware.bin with Katapult's flashtool; do not use -t upload.
[env:fly_micro4_katapult]
extends = env:fly_micro4
board_build.ldscript = memmap_katapult.ld
