; Bench CAN transmitter for the RX-only RP2040 capture.
; Sends valid 1 Mbit/s standard frames continuously with TWAI no-ack mode, so
; the RP2040 can record and decode them without the RP2040 transmitting or
; ACKing. Restore the esp32gui image when the bench test is done.

[platformio]
default_envs = esp32cantx
src_dir = src

[env:esp32cantx]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16m.csv
board_upload.flash_size = 16MB
board_build.extra_flags = -DARDUINO_ESP32S3_DEV -DARDUINO_RUNNING_CORE=1 -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
build_unflags = -DARDUINO_USB_MODE=1
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
