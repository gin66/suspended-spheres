; esp32gui — installation master and operator UI.
;
; Waveshare ESP32-S3-Touch-LCD-7, LVGL 9.2, TWAI at 1 Mbit/s.
; See doc/esp32gui_whitepaper.md. This project deliberately contains no WiFi,
; OTA, Telegram or .private secrets: the show controller is a wired CAN master.
;
; Build:  pio run -e esp32usb
; Flash:  pio run -e esp32usb --target upload   (only when explicitly asked)
;
; CAN is not wired on the bench yet, so the default transport is the mock in
; src/can_transport_mock.cpp. Remove -DSS_CAN_MOCK in the environment when the
; TJA1051 and the bus are connected; src/can_transport_twai.cpp then compiles.

[platformio]
default_envs = esp32usb
src_dir = src

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = spiffs
board_build.partitions = partitions_16m.csv
board_upload.flash_size = 16MB

; Same as the stock esp32-s3-devkitc-1 board JSON minus -DARDUINO_USB_MODE=1.
; The define has to be absent, not overridden.
board_build.extra_flags = -DARDUINO_ESP32S3_DEV -DARDUINO_RUNNING_CORE=1 -DARDUINO_EVENT_RUNNING_CORE=1

platform_packages =

build_flags =
    -I.
    -Iui
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_CONF_PATH=include/lv_conf.h
    -D LV_KCONFIG_IGNORE
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_CACHE_WORKAROUND
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
    -D IS_WAVESHARE_LCD7
    -D BOARD_WS7_ROTATION=1
    -D BOARD_WS7_PCLK_HZ=12000000
    -D BOARD_WS7_DRAW_LINES=20
    -D BOARD_WS7_BOUNCE_LINES=20
    -D BOARD_WS7_FULL_FRAME=0
    -D BOARD_WS7_TOUCH_X_OFFSET=-1
    -D BOARD_WS7_TOUCH_Y_OFFSET=5
    -D SS_CAN_MOCK=1
    -D SS_FW_VERSION=\"0.1.0-stage1\"

build_unflags = -DARDUINO_USB_MODE=1

; The pioarduino Arduino libs ship CONFIG_LCD_RGB_RESTART_IN_VSYNC=1, which
; resets the LCD FIFO/GDMA on every VSYNC-end ISR. The house panel needed it
; off for a stable 800x480 scanout.
custom_sdkconfig =
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=n

lib_deps =
    lvgl/lvgl@~9.2.0

; The shared integer core stays at the repository root and is never copied.
lib_extra_dirs = ../lib


[env:esp32usb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.flash_size = ${common.board_build.flash_size}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
board_build.filesystem = ${common.board_build.filesystem}
board_build.partitions = ${common.board_build.partitions}
board_build.extra_flags = ${common.board_build.extra_flags}
board_upload.flash_size = ${common.board_upload.flash_size}
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}
custom_sdkconfig = ${common.custom_sdkconfig}
lib_deps = ${common.lib_deps}
lib_extra_dirs = ${common.lib_extra_dirs}
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
; Set the CH9102 port here for the bench. Do not commit a machine-specific path.
; upload_port = /dev/tty.usbserial-XXXX
